PARAMETERS:
  DEFAULT:
    backbone: tiny
  SHARED:
    norm_eps: 1.0e-6
    num_classes: 10
  tiny:
    dims: [8, 16]
    depths: [1, 1]
    fin: 3
IMPORTS: {}
INPUTS: [image]
OUTPUTS: [cls]
STRUCTURED_OUTPUT: true
FLOW:
  - [image, {feature: feat2}, backbone, {TYPE: Backbone}]
  - [feature, _, [_obj_, {_addr_: structcast_model.flax.layers.GlobalAveragePool2D}, _call_]]
  - [_, _, [_obj_, {_addr_: flax.nnx.LayerNorm}, {_call_: {num_features: 16, epsilon: 1.0e-6, rngs: "eval: rngs"}}]]
  - [_, cls, head, [_obj_, {_addr_: flax.nnx.Linear}, {_call_: {in_features: 16, out_features: 10, rngs: "eval: rngs"}}]]
Backbone:
  INPUTS: [image]
  OUTPUTS: [feat1, feat2]
  STRUCTURED_OUTPUT: true
  FLOW:
    - _jinja_yaml_: |-
        - _jinja_group_: {{backbone}}
        {% raw %}
          _jinja_yaml_: |-
            - [image, feat1, stem, {TYPE: Stem, PARAM: {DEFAULT: {fin: {{fin}}, fout: {{dims[0]}}}}}]
            - [feat1, feat2, downsample, {TYPE: DownSample, PARAM: {DEFAULT: {fin: {{dims[0]}}, fout: {{dims[1]}}}}}]
        {% endraw %}
Stem:
  OUTPUTS: [out]
  FLOW:
    - _jinja_yaml_: |-
        - INPUTS: inp
          OUTPUTS: out
          LAYER:
            - _obj_
            - _addr_: flax.nnx.Conv
            - _call_: {in_features: {{fin}}, out_features: {{fout}}, kernel_size: [4, 4], strides: [4, 4], padding: SAME, rngs: "eval: rngs"}
DownSample:
  OUTPUTS: [out]
  FLOW:
    - _jinja_yaml_: |-
        - [inp, out, [_obj_, {_addr_: flax.nnx.Conv}, {_call_: {in_features: {{fin}}, out_features: {{fout}}, kernel_size: [2, 2], strides: [2, 2], padding: SAME, rngs: "eval: rngs"}}]]
