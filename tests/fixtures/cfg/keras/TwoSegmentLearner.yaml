# Two-segment Keras learner over three copies of "tests/fixtures/cfg/keras/Linear.yaml".
# The first optimizer owns two models, the second owns one. Nothing is shared between the segments,
# and the two learning rates differ, so a runtime test can assert that each optimizer moves only the
# variables it owns, by its own rate.
PARAMETERS:
  DEFAULT:
    accumulate_gradients: null # set to null or a positive integer
IMPORTS: {}
INPUTS: [x, y]
OUTPUTS: [loss_ab, loss_c]
LEARNERS:
  - NAME: optimizer_ab
    LOSS: loss_ab
    TRAINABLE_LAYERS: [a, b]
    OPTIMIZER:
      - _obj_
      - _addr_: keras.optimizers.SGD
      - _call_:
          learning_rate: 0.1
          _jinja_yaml_: |-
            {% if accumulate_gradients is none %}
            {}
            {% else %}
            gradient_accumulation_steps: {{accumulate_gradients}}
            {% endif %}
    FLOW:
      - [x, out_a, a]
      - [x, out_b, b]
      - INPUTS: {y_true: y, y_pred: out_a}
        OUTPUTS: errors_a
        NAME: mse
        LAYER: [_obj_, {_addr_: keras.losses.mean_squared_error}]
      - [{y_true: y, y_pred: out_b}, errors_b, mse]
      - ["eval: keras.ops.mean(errors_a) + keras.ops.mean(errors_b)", loss_ab, null]
    INFERENCE_FLOW:
      - [x, out_a, a]
      - [x, out_b, b]
      - [{y_true: y, y_pred: out_a}, errors_a, mse]
      - [{y_true: y, y_pred: out_b}, errors_b, mse]
      - ["eval: keras.ops.mean(errors_a) + keras.ops.mean(errors_b)", loss_ab, null]
  - NAME: optimizer_c
    LOSS: loss_c
    TRAINABLE_LAYERS: [c]
    OPTIMIZER:
      - _obj_
      - _addr_: keras.optimizers.SGD
      - _call_:
          learning_rate: 0.01
          _jinja_yaml_: |-
            {% if accumulate_gradients is none %}
            {}
            {% else %}
            gradient_accumulation_steps: {{accumulate_gradients}}
            {% endif %}
    FLOW:
      - [x, out_c, c]
      - [{y_true: y, y_pred: out_c}, errors_c, mse]
      - ["eval: keras.ops.mean(errors_c)", loss_c, null]
    INFERENCE_FLOW:
      - [x, out_c, c]
      - [{y_true: y, y_pred: out_c}, errors_c, mse]
      - ["eval: keras.ops.mean(errors_c)", loss_c, null]
