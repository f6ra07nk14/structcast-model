# Minimal single-segment Flax learner over "tests/fixtures/cfg/flax/Linear.yaml": a squared error
# whose optimum is analytic, so a runtime test can assert the loss actually falls.
PARAMETERS:
  DEFAULT:
    accumulate_gradients: null # set to null or a positive integer
    mixed_precision: false # true, or the DynamicScale keyword arguments the loss is scaled with
IMPORTS: {}
INPUTS: [x, y]
OUTPUTS: [loss]
# The default branch emits an empty mapping rather than "MIXED_PRECISION: false", so the key is
# absent unless it was asked for: a test building this fixture from a raw dict can then add the key
# itself without the template overwriting it.
_jinja_yaml_: |-
  {% if mixed_precision %}
  MIXED_PRECISION: {{ mixed_precision }}
  {% else %}
  {}
  {% endif %}
LEARNERS:
  - NAME: optimizer
    LOSS: loss
    TRAINABLE_LAYERS: [model]
    OPTIMIZER:
      - _obj_
      - _addr_: flax.nnx.Optimizer
      - _bind_:
          _jinja_yaml_: |-
            {% if accumulate_gradients is none %}
            tx: [_obj_, {_addr_: optax.sgd}, {_call_: {learning_rate: 0.1}}]
            {% else %}
            tx:
              - _obj_
              - _addr_: optax.MultiSteps
              - _call_:
                  opt: [_obj_, {_addr_: optax.sgd}, {_call_: {learning_rate: 0.1}}]
                  every_k_schedule: {{accumulate_gradients}}
            {% endif %}
    FLOW:
      - [x, prediction, model]
      - INPUTS: {predictions: prediction, targets: y}
        OUTPUTS: errors
        NAME: mse
        LAYER: [_obj_, {_addr_: optax.squared_error}]
      - ["eval: errors.mean()", loss, null]
    INFERENCE_FLOW:
      - [x, prediction, model]
      - [{predictions: prediction, targets: y}, errors, mse]
      - ["eval: errors.mean()", loss, null]
LOSSES: []
MODELS: []
