[tox]
requires = 
    tox>=4
    tox-uv>=1.0.0
env_list = 
    py{311,312,313}
skip_missing_interpreters = true

[testenv]
description = Base configuration for all test environments
package = editable
wheel_build_env = .pkg
runner = uv-venv-lock-runner
extras = 
    all-cpu
    mlflow
    flops
    wandb
dependency_groups = 
    dev
    tox

[testenv:py{311,312,313}]
description = Run type checking (mypy) and linting (ruff) on {envname}
commands = 
    mypy src
    mypy tests
    ruff format --check src tests
    ruff check src tests
    pytest --no-cov

[testenv:flax-floor]
description = Run the Flax tests against the lowest supported flax, optax and orbax pins
base_python = py312
# Not the lock runner: uv.lock carries the newest flax stack, which is what every other env tests.
runner = uv-venv-runner
extras = 
    mlflow
    wandb
deps = 
    flax==0.12.6
    optax==0.2.6
    orbax-checkpoint==0.11.20
    # flax 0.12.6 declares jax>=0.8.1, but subclasses jax.core.Effect, which jax 0.11 removed, so the
    # newest jax it imports under is 0.10. The extras cannot carry this cap: flax 0.12.8 and newer
    # need jax 0.11.
    jax[cpu]<0.11
    # tests/loggers/conftest.py imports the torch trainer, so the shared conftest needs the torch stack.
    timm>=1.0.0,<2.0.0
    torch>=2.0.0
    torchvision>=0.15.0
dependency_groups = 
    dev
set_env = 
    UV_EXTRA_INDEX_URL = https://download.pytorch.org/whl/cpu
    UV_INDEX_STRATEGY = unsafe-best-match
commands = 
    pytest tests/flax tests/builders/test_flax_builder.py tests/commands/test_cmd_flax.py tests/loggers/test_state_backends.py --no-cov

[testenv:lint]
description = Check code formatting and linting with ruff
skip_install = false
commands = 
    ruff format --check src tests
    ruff check src tests

[testenv:format]
description = Auto-format code with ruff
skip_install = false
commands = 
    ruff format src tests

[testenv:type-check]
description = Run type checking with mypy
skip_install = false
commands = 
    mypy src
    mypy tests

[testenv:type-check-py{311,312,313}]
description = Run type checking with mypy across Python versions
skip_install = false
commands = 
    mypy src
    mypy tests
