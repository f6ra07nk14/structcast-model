# Distributed strategy pattern: tensor parallelism, on the jax Keras backend alone -- the tensorflow
# and torch cells are refused at construction with the reason (docs/adr/0016, docs/adr/0022). The
# mesh is two-dimensional, ("batch", "model"), with a batch axis of one: every device holds a slice
# of the layers the rules name and runs the whole batch through it. "column" splits a variable by its
# last dimension (a bias with it), "row" splits by the first one and leaves the bias whole, because
# the reduction that follows a row-parallel layer would otherwise count a split bias once per shard.
# A dimension the devices do not divide falls back to replication rather than failing the run. Rules
# are required: which layers pair up into a column/row split is the model's own shape. The pattern is
# called with device=...; bind devices to use only the first N of them.
#
# The rules below are (variable-path regex, tactic) pairs written for
# cfg/keras/models/VisionTransformer.yaml and must be adapted to the model they run on: a rule
# matching no variable is refused at wrap time, and `for v in model.variables: print(v.path)` lists
# what to write instead. The attention kernels are the fused three-dimensional ones Keras builds, so
# "column" splits the head dimension of query, key and value while "row" splits the head count of
# attention_output: correct, and resharded between the two rather than the zero-communication
# Megatron layout, which needs a head-axis tactic the two-word vocabulary does not have.
# cfg/keras/models/SmallLanguageModel.yaml writes its attention as a section of its own template
# instead of calling keras.layers.MultiHeadAttention, so its pair is named after the two projections
# that section builds (commented below). The MLP pair is deliberately not named: Keras numbers its
# Dense layers from a global counter (dense, dense_1, ... including the classifier head), so no
# stable regex tells the first of a block from the second.
- _obj_
- _addr_: structcast_model.keras.distributed.KerasDistributedStrategy
- _bind_:
    preset: tp
    # devices: 4
    rules:
      - ["multi_head_attention.*/(query|key|value)/", column]
      - ["multi_head_attention.*/attention_output/", row]
      # SmallLanguageModel.yaml, whose attention is a section of its own:
      # - ["causal_self_attention.*/qkv_proj/", column]
      # - ["causal_self_attention.*/out_proj/", row]
