PARAMETERS:
  DEFAULT:
    backbone: atto
  SHARED:
    stem_kernel_size: 4
    kernel_size: 7
    drop_path_rate: 0.
    norm_eps: 1.0e-6
    activation: gelu
    mlp_ratio: 4
    num_classes: 1000
  # backbone model parameters
  atto:
    dims: [40, 80, 160, 320]
    depths: [2, 2, 6, 2]
  femto:
    dims: [48, 96, 192, 384]
    depths: [2, 2, 6, 2]
  pico:
    dims: [64, 128, 256, 512]
    depths: [2, 2, 6, 2]
  nano:
    dims: [80, 160, 320, 640]
    depths: [2, 2, 8, 2]
  tiny:
    dims: [96, 192, 384, 768]
    depths: [3, 3, 9, 3]
  small:
    dims: [96, 192, 384, 768]
    depths: [3, 3, 27, 3]
  base:
    dims: [128, 256, 512, 1024]
    depths: [3, 3, 27, 3]
  large:
    dims: [192, 384, 768, 1536]
    depths: [3, 3, 27, 3]
  huge:
    dims: [352, 704, 1408, 2816]
    depths: [3, 3, 27, 3]
IMPORTS: {}
INPUTS: [image]
OUTPUTS: [cls]
STRUCTURED_OUTPUT: true
FLOW:
  - [image, {feature: feat4}, backbone, {TYPE: Backbone}]
  - [feature, _, [_obj_, {_addr_: keras.layers.GlobalAveragePooling2D}, {_call_: {data_format: channels_last}}]]
  - _jinja_yaml_: |-
      - [_, _, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
      - [_, cls, head, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: {{num_classes}}}}]]
Backbone:
  INPUTS: [image]
  OUTPUTS: [feat1, feat2, feat3, feat4]
  STRUCTURED_OUTPUT: true
  _jinja_yaml_: |-
    FLOW: 
      - _jinja_group_: {{backbone}}
      {% raw %}
        _jinja_yaml_: |-
          {% set cum_depths = [0] + depths | cumsum %}
          - [image, feat1, {TYPE: Stem, PARAM: {DEFAULT: {fout: {{dims[0]}}}}}]
          {% for i in range(cum_depths[0], cum_depths[1]) %}
          - [feat1, feat1, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[0]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
          {% endfor %}
          - [feat1, feat2, "downsample1", {TYPE: DownSample, PARAM: {DEFAULT: {fout: {{dims[1]}}}}}]
          {% for i in range(cum_depths[1], cum_depths[2]) %}
          - [feat2, feat2, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[1]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
          {% endfor %}
          - [feat2, feat3, "downsample2", {TYPE: DownSample, PARAM: {DEFAULT: {fout: {{dims[2]}}}}}]
          {% for i in range(cum_depths[2], cum_depths[3]) %}
          - [feat3, feat3, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[2]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
          {% endfor %}
          - [feat3, feat4, "downsample3", {TYPE: DownSample, PARAM: {DEFAULT: {fout: {{dims[3]}}}}}]
          {% for i in range(cum_depths[3], cum_depths[4]) %}
          - [feat4, feat4, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[3]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
          {% endfor %}
      {% endraw %}
Stem:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW:
      - INPUTS: inp
        OUTPUTS: _
        LAYER:
          - _obj_
          - _addr_: keras.layers.Conv2D
          - _call_: {filters: {{fout}}, kernel_size: {{stem_kernel_size}}, strides: {{stem_kernel_size}}, padding: same}
      - [_, out, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
DownSample:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW:
      - [inp, _, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
      - INPUTS: _
        OUTPUTS: out
        LAYER: 
          - _obj_
          - {_addr_: keras.layers.Conv2D}
          - {_call_: {filters: {{fout}}, kernel_size: 2, strides: 2, padding: same, data_format: channels_last}}
Block:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW:
      - INPUTS: inp
        OUTPUTS: _
        LAYER: [_obj_, {_addr_: keras.layers.DepthwiseConv2D}, {_call_: {kernel_size: {{kernel_size}}, padding: same}}]
      - [_, _, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
      - INPUTS: _
        OUTPUTS: _
        LAYER: 
          - _obj_
          - {_addr_: keras.layers.Conv2D}
          - {_call_: {filters: "eval: {{fout}} * {{mlp_ratio}}", kernel_size: 1, padding: same, data_format: channels_last}}
      - [_, _, [_obj_, {_addr_: keras.layers.Activation}, {_call_: {activation: {{activation}}}}]]
      - [_, _, [_obj_, {_addr_: structcast_model.keras.layers.GlobalResponseNorm}, {_call_: {epsilon: {{norm_eps}}}}]]
      - INPUTS: _
        OUTPUTS: _
        LAYER: 
          - _obj_
          - {_addr_: keras.layers.Conv2D}
          - {_call_: {filters: "eval: {{fout}} * {{mlp_ratio}}", kernel_size: 1, padding: same, data_format: channels_last}}
      - [_, feat, [_obj_, {_addr_: keras.layers.Dropout}, {_call_: {rate: {{drop_path}}, noise_shape: [null, 1, 1, 1]}}]]
      - [[[inp, feat]], out, [_obj_, {_addr_: keras.layers.Add}, _call_]]