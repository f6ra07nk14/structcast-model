# The Keras twin of "cfg/torch/models/SmallLanguageModel.yaml": a GPT-style decoder reading "tokens"
# and emitting "logits" over the vocabulary, with a "backbone" of pre-LN blocks named "block0" ...
# "blockN-1", whose causal attention, rotary position embedding included, is a section of this
# configuration rather than a package layer.
# "keras.layers.MultiHeadAttention" is deliberately not used: it builds its own query/key/value
# projections and leaves nowhere to rotate the query and the key, and the point of the rotation is
# that the model carries no position table and therefore no longest sequence it can run.
# The root emits a structured output, as "cfg/keras/models/ConvNeXtV2.yaml" does and as
# "scm keras create model" forces by default, so the learner reads "logits" off the returned mapping.
PARAMETERS:
  DEFAULT:
    size: tiny
  SHARED:
    # "vocab_size", "max_seq_len" and "dropout" are shared instead of default parameters: the flows
    # below select a size group with "_jinja_group_", and a group sees its own parameters merged
    # with the shared ones, never the default ones. Overriding them on the command line therefore
    # means overriding them on the selected size group, e.g. -p "tiny: {vocab_size: 100}".
    vocab_size: 65 # the character vocabulary of Tiny Shakespeare
    # Only the length of the "INPUT_SHAPES" dummy forward: the rotary position embedding below
    # derives its angles from the sequence length of the actual input, so the model has no position
    # table and no length it cannot run.
    max_seq_len: 256
    dropout: 0.0
    norm_eps: 1.0e-5
    mlp_ratio: 4
    rope_base: 10000.0 # the standard RoPE frequency base
  # model size parameters
  tiny:
    dim: 256
    heads: 4
    depth: 4
  small:
    dim: 512
    heads: 8
    depth: 8
IMPORTS: {}
INPUTS: [tokens]
_jinja_yaml_: |-
  _jinja_group_: {{size}}
  {% raw %}
  _jinja_yaml_: |-
    INPUT_SHAPES:
      tokens: {_SHAPE_: [{{max_seq_len}}], _DTYPE_: int64}
  {% endraw %}
OUTPUTS: [logits]
STRUCTURED_OUTPUT: true
FLOW:
  - _jinja_yaml_: |-
      - _jinja_group_: {{size}}
      {% raw %}
        _jinja_yaml_: |-
          - [tokens, feature, token_embedding, [_obj_, {_addr_: keras.layers.Embedding}, {_call_: {input_dim: {{vocab_size}}, output_dim: {{dim}}}}]]
          - [feature, feature, [_obj_, {_addr_: keras.layers.Dropout}, {_call_: {rate: {{dropout}}}}]]
          - [feature, feature, backbone, {TYPE: Backbone}]
          - [feature, feature, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
          - [feature, logits, head, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: {{vocab_size}}, use_bias: false}}]]
      {% endraw %}
Backbone:
  OUTPUTS: [feature]
  _jinja_yaml_: |-
    FLOW:
      - _jinja_group_: {{size}}
      {% raw %}
        _jinja_yaml_: |-
          {% for i in range(depth) %}
          - [feature, feature, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {dim: {{dim}}, heads: {{heads}}, dropout: {{dropout}}}}}]
          {% endfor %}
      {% endraw %}
Block:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW:
      - [inp, _, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
      - [_, attended, {TYPE: CausalSelfAttention, PARAM: {DEFAULT: {dim: {{dim}}, heads: {{heads}}}}}]
      - ["eval: inp + attended", residual, null]
      - [residual, _, [_obj_, {_addr_: keras.layers.LayerNormalization}, {_call_: {epsilon: {{norm_eps}}}}]]
      - [_, _, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: "eval: {{dim}} * {{mlp_ratio}}"}}]]
      - [_, _, [_obj_, {_addr_: keras.layers.Activation}, {_call_: {activation: gelu}}]]
      - [_, _, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: {{dim}}}}]]
      - [_, projected, [_obj_, {_addr_: keras.layers.Dropout}, {_call_: {rate: {{dropout}}}}]]
      - ["eval: residual + projected", out, null]
CausalSelfAttention:
  # Causal self-attention with rotary position embedding, defined entirely here: two
  # "keras.layers.Dense" projections plus flow lines for the head split, the rotation and the fused
  # attention kernel.
  # There is no attention-weight dropout: "keras.ops.dot_product_attention" takes no dropout at all,
  # and small language models train attention dropout at 0 anyway; the dropouts that matter sit in
  # the MLP and residual paths of "Block", where "keras.layers.Dropout" reads the "training" flag
  # the generated call hands it.
  OUTPUTS: [out]
  _jinja_yaml_: |-
    {% set head_dim = dim // heads %}
    {% set half_dim = head_dim // 2 %}
    FLOW:
      # (batch, seq, dim) -> (batch, seq, 3 * dim) -> (batch, seq, 3, heads, {{head_dim}}).
      # The fused projection is laid out as q, k, v each of "dim" contiguous features, heads-major
      # within each, so one reshape performs both the qkv split and the head split; the fused
      # kernel below reads (batch, seq, heads, head_dim) directly, so nothing is transposed.
      # "keras.layers.Reshape" is given the shape without the batch dimension, which the symbolic
      # trace leaves unknown, and infers the sequence length the run actually carries.
      # Both projections carry an explicit "name": a Keras variable path spells the layer's own name,
      # not the attribute it hangs on, and Keras numbers unnamed "Dense" layers from a process-global
      # counter -- so without it no regex, tensor-parallel rules above all, could tell the fused
      # projection of one block from the output projection of another.
      - [inp, qkv, qkv_proj, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: {{3 * dim}}, name: qkv_proj}}]]
      - [qkv, fused, split_qkv, [_obj_, {_addr_: keras.layers.Reshape}, {_call_: {target_shape: [-1, 3, {{heads}}, {{head_dim}}]}}]]
      - ["eval: fused[:, :, 0]", query, null]
      - ["eval: fused[:, :, 1]", key, null]
      - ["eval: fused[:, :, 2]", value, null]
      # Rotary position embedding: angles for the actual sequence length, shared by every head as
      # (1, seq, 1, {{head_dim}}), so nothing here is bound to a maximum length.
      - ["eval: keras.ops.arange(inp.shape[1], dtype='float32')", positions, null]
      - ["eval: {{rope_base}} ** (-keras.ops.arange(0, {{head_dim}}, 2, dtype='float32') / {{head_dim}})", inv_freq, null]
      - ["eval: positions[:, None] * inv_freq", freqs, null]
      - ["eval: keras.ops.concatenate((freqs, freqs), axis=-1)", angles, null]
      - ["eval: keras.ops.cast(keras.ops.cos(angles)[None, :, None], query.dtype)", cos, null]
      - ["eval: keras.ops.cast(keras.ops.sin(angles)[None, :, None], query.dtype)", sin, null]
      # Rotate the query and the key by their position: "x * cos + rotate_half(x) * sin".
      - ["eval: query * cos + keras.ops.concatenate((-query[..., {{half_dim}}:], query[..., :{{half_dim}}]), axis=-1) * sin", query, null]
      - ["eval: key * cos + keras.ops.concatenate((-key[..., {{half_dim}}:], key[..., :{{half_dim}}]), axis=-1) * sin", key, null]
      # "is_causal=True" masks the future inside the kernel, so no (seq x seq) mask is materialized.
      - ["eval: keras.ops.dot_product_attention(query, key, value, is_causal=True)", attended, null]
      # (batch, seq, heads, {{head_dim}}) -> (batch, seq, dim).
      - [attended, attended, merge_heads, [_obj_, {_addr_: keras.layers.Reshape}, {_call_: {target_shape: [-1, {{dim}}]}}]]
      - [attended, out, out_proj, [_obj_, {_addr_: keras.layers.Dense}, {_call_: {units: {{dim}}, name: out_proj}}]]
