# Keyword arguments for the compiler the active Keras backend has, which "--compile" hands the
# timed forward of "scm keras time" and the generated steps of "scm keras train" to.
# The two compilers share no keyword, so there is nothing to fill in that both accept and the file
# ships empty -- "{}" is what "--compile true" passes: compile with the compiler's own defaults.
# On tensorflow the call is "tf.function", whose knobs are "jit_compile" (true asks XLA for the
# graph, false stays in TensorFlow's own), "reduce_retracing" and "autograph".
# On jax it is "jax.jit", whose knobs are "keep_unused" (true keeps arguments the step never reads,
# instead of dropping them from the trace) and "inline".
# The arguments deciding what is static and what is donated on jax -- "static_argnames",
# "static_argnums", "donate_argnames" and "donate_argnums" -- and "input_signature" on tensorflow
# are the step's own contract and are dropped from whatever is passed here, so naming one changes
# nothing.
# The mapping below stays: a file of comments alone loads as null, which reads as no compilation.
{}
