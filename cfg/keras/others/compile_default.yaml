# Keyword arguments for "keras.Model.compile", which "scm keras time --compile" calls with
# "optimizer=None" ("optimizer" cannot be set here). This is Keras run configuration, not graph
# compilation: "jit_compile" is what asks the backend for an XLA-compiled step.
# "scm keras train --compile" does not read this file: there the flag hands the learner's steps to
# the backend's own graph compiler, and takes that compiler's keyword arguments instead.
jit_compile: auto # "auto" (XLA where the backend supports it), true or false
run_eagerly: false
steps_per_execution: 1
