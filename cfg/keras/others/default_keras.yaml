# The Keras counterpart of "cfg/torch/others/default_timm.yaml": one rendered dataset pattern for
# "scm keras train --training-dataset" / "--validation-dataset".
# "dataset" has no default and must be given: it names the "keras.datasets" set to download, and a
# default here would fetch one nobody asked for. "training" selects the split and everything that
# follows from it -- the training split is shuffled and augmented (a horizontal flip and a
# pad-then-crop, as core Keras preprocessing layers inside the tf.data pipeline), the validation
# split is neither.
# Render it twice, once per split, e.g.
#   scm format cfg/keras/others/default_keras.yaml -o dataset_train.yaml \
#       -p 'DEFAULT: {dataset: cifar100, training: true}'
PARAMETERS:
  DEFAULT:
    training: false
    batch_size: 32
    image_size: [32, 32]
    crop_padding: 4 # pixels padded on each side before the random crop; 0 disables the crop
    seed: 42
_obj_:
  - _addr_: KerasImageData
    _file_: examples/keras/data.py
  - _attr_: model_validate
  - - _call_
    # The batch keys the learner reads, which is the whole of the mapping between the pipeline and
    # the model: "image" and "label" are what "cfg/keras/learners/ImageClassifier.yaml" and
    # "cfg/keras/learners/ConvNeXtV2.yaml" declare as their INPUTS, and a learner naming its inputs
    # differently is served by renaming them here rather than by changing the pipeline.
    - image_key: image
      label_key: label
      _jinja_yaml_: |-
        {% if dataset is not defined %}
        {{ 'dataset is required and has no default: pass -p "DEFAULT: {dataset: cifar10}" (or mnist, cifar100).' | raise_error }}
        {% endif %}
        dataset: {{dataset}}
        training: {{training}}
        batch_size: {{batch_size}}
        image_size: {{image_size}}
        crop_padding: {{crop_padding}}
        seed: {{seed}}
