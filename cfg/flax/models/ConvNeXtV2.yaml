PARAMETERS:
  DEFAULT:
    backbone: atto
  SHARED:
    image_channels: 3
    stem_kernel_size: 4
    kernel_size: 7
    drop_path_rate: 0.
    norm_eps: 1.0e-6
    # A "flax.nnx" activation function; the block below calls it with "approximate=False", which
    # only "gelu" takes, so any other name is a TypeError on the first forward pass.
    activation: gelu
    mlp_ratio: 4
    num_classes: 1000
  # backbone model parameters
  atto:
    dims: [40, 80, 160, 320]
    depths: [2, 2, 6, 2]
  femto:
    dims: [48, 96, 192, 384]
    depths: [2, 2, 6, 2]
  pico:
    dims: [64, 128, 256, 512]
    depths: [2, 2, 6, 2]
  nano:
    dims: [80, 160, 320, 640]
    depths: [2, 2, 8, 2]
  tiny:
    dims: [96, 192, 384, 768]
    depths: [3, 3, 9, 3]
  small:
    dims: [96, 192, 384, 768]
    depths: [3, 3, 27, 3]
  base:
    dims: [128, 256, 512, 1024]
    depths: [3, 3, 27, 3]
  large:
    dims: [192, 384, 768, 1536]
    depths: [3, 3, 27, 3]
  huge:
    dims: [352, 704, 1408, 2816]
    depths: [3, 3, 27, 3]
IMPORTS: {}
INPUTS: [image]
OUTPUTS: [cls]
STRUCTURED_OUTPUT: true
FLOW:
  - [image, {feature: feat4}, backbone, {TYPE: Backbone}]
  # Global average pool: mean over spatial axes (H, W) → (B, C)
  - ["eval: feature.mean(axis=(1, 2))", _, null]
  - _jinja_yaml_: |-
      - _jinja_group_: {{backbone}}
      {% raw %}
        _jinja_yaml_: |-
          - [_, _, [_obj_, {_addr_: flax.nnx.LayerNorm}, {_call_: {num_features: {{dims[-1]}}, epsilon: {{norm_eps}}, rngs: "eval: rngs"}}]]
          - [_, cls, head, [_obj_, {_addr_: flax.nnx.Linear}, {_call_: {in_features: {{dims[-1]}}, out_features: {{num_classes}}, rngs: "eval: rngs"}}]]
      {% endraw %}
Backbone:
  INPUTS: [image]
  OUTPUTS: [feat1, feat2, feat3, feat4]
  STRUCTURED_OUTPUT: true
  FLOW:
    - _jinja_yaml_: |-
        - _jinja_group_: {{backbone}}
        {% raw %}
          _jinja_yaml_: |-
            {% set cum_depths = [0] + depths | cumsum %}
            - [image, feat1, {TYPE: Stem, PARAM: {DEFAULT: {fin: {{image_channels}}, fout: {{dims[0]}}}}}]
            {% for i in range(cum_depths[0], cum_depths[1]) %}
            - [feat1, feat1, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[0]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
            {% endfor %}
            - [feat1, feat2, "downsample1", {TYPE: DownSample, PARAM: {DEFAULT: {fin: {{dims[0]}}, fout: {{dims[1]}}}}}]
            {% for i in range(cum_depths[1], cum_depths[2]) %}
            - [feat2, feat2, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[1]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
            {% endfor %}
            - [feat2, feat3, "downsample2", {TYPE: DownSample, PARAM: {DEFAULT: {fin: {{dims[1]}}, fout: {{dims[2]}}}}}]
            {% for i in range(cum_depths[2], cum_depths[3]) %}
            - [feat3, feat3, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[2]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
            {% endfor %}
            - [feat3, feat4, "downsample3", {TYPE: DownSample, PARAM: {DEFAULT: {fin: {{dims[2]}}, fout: {{dims[3]}}}}}]
            {% for i in range(cum_depths[3], cum_depths[4]) %}
            - [feat4, feat4, "block{{i}}", {TYPE: Block, PARAM: {DEFAULT: {fout: {{dims[3]}}, drop_path: {{drop_path_rate * i / (cum_depths[-1] - 1) if cum_depths[-1] > 1 else 0.0}}}}}]
            {% endfor %}
        {% endraw %}
Stem:
  OUTPUTS: [out]
  FLOW:
    - _jinja_yaml_: |-
        - INPUTS: inp
          OUTPUTS: _
          LAYER:
            - _obj_
            - _addr_: flax.nnx.Conv
            - _call_:
                in_features: {{fin}}
                out_features: {{fout}}
                kernel_size: [{{stem_kernel_size}}, {{stem_kernel_size}}]
                strides: [{{stem_kernel_size}}, {{stem_kernel_size}}]
                padding: SAME
                rngs: "eval: rngs"
        - [_, out, [_obj_, {_addr_: flax.nnx.LayerNorm}, {_call_: {num_features: {{fout}}, epsilon: {{norm_eps}}, rngs: "eval: rngs"}}]]
DownSample:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW:
      - [inp, _, [_obj_, {_addr_: flax.nnx.LayerNorm}, {_call_: {num_features: {{fin}}, epsilon: {{norm_eps}}, rngs: "eval: rngs"}}]]
      - INPUTS: _
        OUTPUTS: out
        LAYER:
          - _obj_
          - _addr_: flax.nnx.Conv
          - _call_:
              in_features: {{fin}}
              out_features: {{fout}}
              kernel_size: [2, 2]
              strides: [2, 2]
              padding: SAME
              rngs: "eval: rngs"
Block:
  OUTPUTS: [out]
  _jinja_yaml_: |-
    FLOW: 
      - INPUTS: inp
        OUTPUTS: _
        LAYER:
          - _obj_
          - _addr_: flax.nnx.Conv
          - _call_:
              in_features: {{fout}}
              out_features: {{fout}}
              kernel_size: [{{kernel_size}}, {{kernel_size}}]
              strides: [1, 1]
              padding: SAME
              feature_group_count: {{fout}}
              rngs: "eval: rngs"
      - [_, _, [_obj_, {_addr_: flax.nnx.LayerNorm}, {_call_: {num_features: {{fout}}, epsilon: {{norm_eps}}, rngs: "eval: rngs"}}]]
      - INPUTS: _
        OUTPUTS: _
        LAYER:
          - _obj_
          - {_addr_: flax.nnx.Linear}
          - {_call_: {in_features: {{fout}}, out_features: "eval: {{fout}} * {{mlp_ratio}}", rngs: "eval: rngs"}}
      # "approximate=False" is the exact erf GELU the torch and Keras twins use; the jax default is
      # the tanh approximation, and the two agree to no more than about three decimals. Every value
      # bound here is a literal, which is what lets the builder hoist the bound callable to a
      # module-level constant, so two instances of this class still share one graphdef and one trace.
      - [_, _, [_obj_, {_addr_: "flax.nnx.{{activation}}"}, {_bind_: {approximate: false}}]]
      - INPUTS: _
        OUTPUTS: _
        LAYER:
          - _obj_
          - {_addr_: structcast_model.flax.layers.GlobalResponseNorm}
          - {_call_: {num_features: "eval: {{fout}} * {{mlp_ratio}}", epsilon: {{norm_eps}}, rngs: "eval: rngs"}}
      - INPUTS: _
        OUTPUTS: _
        LAYER:
          - _obj_
          - {_addr_: flax.nnx.Linear}
          - {_call_: {in_features: "eval: {{fout}} * {{mlp_ratio}}", out_features: {{fout}}, rngs: "eval: rngs"}}
      - INPUTS: _
        OUTPUTS: feat
        LAYER:
          - _obj_
          - {_addr_: flax.nnx.Dropout}
          - {_call_: {rate: {{drop_path}}, broadcast_dims: [2, 3, 4], rngs: "eval: rngs"}}
      - ["eval: inp + feat", out, null]
