# Distributed strategy pattern: FSDP2 and tensor parallelism on a two-dimensional (dp, tp) mesh
# (torch>=2.6). The ranks are laid out row-major, so tensor_parallel_size adjacent ranks form one
# tensor-parallel group holding one model copy between them, and the world size divided by it is the
# number of data replicas; parallelize_module runs first and fully_shard wraps its result on the data
# submesh. Every rank of one group must read the same slice of the dataset, which the CLI publishes
# as DATA_RANK and DATA_WORLD_SIZE and derives the run's seed from. The pattern is called with
# device=... and local_rank=...; parallel_modules is the plan tp.yaml documents, and every FSDP2 knob
# (shard_modules, reshard_after_forward, mp_policy, sync_batchnorm) is bound here as in fsdp2.yaml.
#
# The plan below is written for cfg/torch/models/VisionTransformer.yaml and must be adapted to the
# model it runs on: a pattern matching no module anywhere is refused at wrap time. See tp.yaml for
# the styles and for the SmallLanguageModel variant.
- _obj_
- _addr_: structcast_model.torch.distributed.FullyShardedTensorParallelStrategy
- _bind_:
    tensor_parallel_size: 2
    reshard_after_forward: true
    parallel_modules:
      - ["backbone.block*.self_attention.qkv_proj", column_heads]
      - ["backbone.block*.self_attention.out_proj", row]
      - ["backbone.block*.linear", column]
      - ["backbone.block*.linear_1", row]
    # shard_modules: ["backbone.block*"]
    # sync_batchnorm: false
