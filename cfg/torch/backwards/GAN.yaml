# GAN Backward Configuration Template
#
# This template supports multi-optimizer training flows such as Generative Adversarial Networks (GANs).
# Multiple BACKWARDS entries are each processed as independent optimization units:
#   - Without gradient accumulation: each entry runs zero_grad → backward → step in sequence,
#     preventing gradient contamination across entries (required for correct GAN training).
#   - With gradient accumulation: all backward passes are accumulated first, then all optimizers
#     are stepped together on the update step.
#
# Usage example (CycleGAN-like setup):
#   scm torch train --backward-cfg cfg/torch/backwards/GAN.yaml \
#                   --backward-param DEFAULT.generator_lr=2e-4 \
#                   --backward-param DEFAULT.discriminator_lr=2e-4 \
#                   --backward-param DEFAULT.generator_name=generator \
#                   --backward-param DEFAULT.discriminator_name=discriminator \
#                   ...
#
# The losses module (specified via --loss-cfg or --loss-pattern) must return a dict containing
# all loss keys referenced in BACKWARDS[*].LOSS. For GAN, it should accept model objects
# forwarded by TrainingStep (e.g. generator=<module>, discriminator=<module>) to perform
# additional forward passes (e.g. calling the discriminator on fake images).
#
# See https://github.com/eriklindernoren/Pytorch-GAN for reference GAN implementations.
PARAMETERS:
  DEFAULT:
    generator_name: generator
    discriminator_name: discriminator
    generator_loss: loss_G
    discriminator_loss: loss_D
    epochs: 200
    warmup_epochs: 0
    generator_lr: 2.0e-4
    discriminator_lr: 2.0e-4
    weight_decay: 0.0
    accumulate_gradients: null
IMPORTS: {}
MIXED_PRECISION: false
MIXED_PRECISION_TYPE: null
_jinja_yaml_: |-
  {% if accumulate_gradients is none %}
  ACCUMULATE_GRADIENTS: null
  {% else %}
  ACCUMULATE_GRADIENTS: {{accumulate_gradients}}
  {% endif %}
BACKWARDS:
  - NAME: backward_G
    _jinja_yaml_: |-
      LOSS: {{generator_loss}}
    OPTIMIZERS:
      - NAME: optimizer_G
        OPTIMIZER:
          - _obj_
          - _addr_: structcast_model.torch.optimizers.create_with_scheduler
          - _bind_:
              optimizer_kwargs:
                opt: adam
                betas: [0.5, 0.999]
                weight_decay_regexes: []
                no_weight_decay_regexes: []
                _jinja_yaml_: |-
                  lr: {{generator_lr}}
                  weight_decay: {{weight_decay}}
              scheduler_kwargs:
                name: cosine
                min_lr: 1.0e-6
                warmup_lr: 1.0e-5
                warmup_prefix: false
                step_on_epochs: true
                k_decay: 1.0
                _jinja_yaml_: |-
                  criterion: {{generator_loss}}
                  warmup_epochs: {{warmup_epochs}}
                  num_epochs: {{epochs}}
        _jinja_yaml_: |-
          LAYERS: {{generator_name}}
        CLIP: null
  - NAME: backward_D
    _jinja_yaml_: |-
      LOSS: {{discriminator_loss}}
    OPTIMIZERS:
      - NAME: optimizer_D
        OPTIMIZER:
          - _obj_
          - _addr_: structcast_model.torch.optimizers.create_with_scheduler
          - _bind_:
              optimizer_kwargs:
                opt: adam
                betas: [0.5, 0.999]
                weight_decay_regexes: []
                no_weight_decay_regexes: []
                _jinja_yaml_: |-
                  lr: {{discriminator_lr}}
                  weight_decay: {{weight_decay}}
              scheduler_kwargs:
                name: cosine
                min_lr: 1.0e-6
                warmup_lr: 1.0e-5
                warmup_prefix: false
                step_on_epochs: true
                k_decay: 1.0
                _jinja_yaml_: |-
                  criterion: {{discriminator_loss}}
                  warmup_epochs: {{warmup_epochs}}
                  num_epochs: {{epochs}}
        _jinja_yaml_: |-
          LAYERS: {{discriminator_name}}
        CLIP: null
LOSSES: []
MODELS: []
